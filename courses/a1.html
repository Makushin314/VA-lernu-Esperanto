<!-- ═══════════════════════════════════════════════════════════
     МГНОВЕННОЕ ПРИМЕНЕНИЕ ТЕМЫ И ПОЗИЦИИ САЙДБАРА
     (без вспышки тёмной темы при загрузке)
     Должно идти СРАЗУ после <link> на CSS и ДО </head>
     ═══════════════════════════════════════════════════════════ -->
<script>
(function () {
    try {
        // Словарь тем — дублирует js/theme.js, чтобы не ждать загрузки скриптов
        var THEMES = {
            dark:   { '--bg':'#0D110F','--card':'#151A17','--card2':'#1C231E','--input':'#202821','--border':'#29332C','--text':'#F3F6F3','--muted':'#9CA79E','--green':'#00A000','--green-hover':'#00B800','--danger':'#D9534F' },
            light:  { '--bg':'#F2F6F2','--card':'#FFFFFF','--card2':'#F7FAF7','--input':'#EEF3EE','--border':'#D9E2D9','--text':'#172019','--muted':'#68736B','--green':'#00A000','--green-hover':'#00B800','--danger':'#D9534F' },
            winter: { '--bg':'#0B1520','--card':'#132234','--card2':'#182B40','--input':'#1D344C','--border':'#274562','--text':'#EAF4FB','--muted':'#8FA8C0','--green':'#4DA6FF','--green-hover':'#6BB8FF','--danger':'#E85D75' },
            forest: { '--bg':'#0A130E','--card':'#122018','--card2':'#17291F','--input':'#1C3126','--border':'#253D2F','--text':'#E8F2E8','--muted':'#8FAF93','--green':'#2E8B57','--green-hover':'#3DA66A','--danger':'#C9645B' },
            autumn: { '--bg':'#1A1210','--card':'#241A15','--card2':'#2E211B','--input':'#342720','--border':'#42332A','--text':'#F5EDE5','--muted':'#B8A398','--green':'#D2691E','--green-hover':'#E67E22','--danger':'#C0392B' },
            cat:    { '--bg':'#14101C','--card':'#1C1826','--card2':'#231E30','--input':'#2A2338','--border':'#3A2F4A','--text':'#F0EAF5','--muted':'#9C93B0','--green':'#F5A623','--green-hover':'#FFB84D','--danger':'#E85D75' }
        };

        var root = document.documentElement;

        // 1. Тема
        var themeKey = localStorage.getItem('va_eo_theme') || 'dark';
        var theme = THEMES[themeKey] || THEMES.dark;
        root.setAttribute('data-theme-key', themeKey);
        for (var k in theme) {
            if (Object.prototype.hasOwnProperty.call(theme, k)) {
                root.style.setProperty(k, theme[k]);
            }
        }

        // 2. Позиция сайдбара — сразу на <html>, как в a2/b2/index
        var pos = localStorage.getItem('va_eo_sidebar_pos');
        if (!pos) pos = window.innerWidth <= 700 ? 'top' : 'left';
        if (pos !== 'left' && pos !== 'top') pos = 'left';
        root.setAttribute('data-sidebar-pos', pos);

        // 3. Резервный таймер: если theme.js не выполнится — показать сайдбар
        setTimeout(function () {
            if (!document.documentElement.hasAttribute('data-nav-ready')) {
                document.documentElement.setAttribute('data-nav-ready', '1');
            }
        }, 1200);
    } catch (e) { /* тихо игнорируем */ }
})();
</script>
